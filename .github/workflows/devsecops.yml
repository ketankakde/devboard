name: DevSecOps Pipeline

on:
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Run security scans only (skip deploy)"
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_PREFIX: devboard

jobs:
  build-backend:
    name: Build Backend JARs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build all JARs
        run: mvn clean package -DskipTests
        working-directory: backend

      - uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            backend/auth-service/target/auth-service-1.0.0.jar
            backend/project-service/target/project-service-1.0.0.jar
            backend/task-service/target/task-service-1.0.0.jar
            backend/api-gateway/target/api-gateway-1.0.0.jar
          retention-days: 1

  sonarqube:
    name: SonarQube — SAST
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: backend-jars

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=ketankakde
            -Dsonar.projectName=devboard
            -Dsonar.sources=backend,frontend/src
            -Dsonar.java.binaries=backend/**/target/classes

  snyk:
    name: Snyk — Dependency Scan
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk auth
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Snyk — Backend (Maven)
        run: snyk test --all-projects --severity-threshold=high --file=pom.xml
        working-directory: backend

      - name: Snyk — Frontend (npm)
        run: snyk test --severity-threshold=high --file=package.json
        working-directory: frontend

      - name: Snyk — Monitor backend
        if: github.ref == 'refs/heads/main'
        run: snyk monitor --all-projects --file=pom.xml
        working-directory: backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  trivy:
    name: Trivy — Container Scan (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            dockerfile: backend/auth-service/Dockerfile
            context: backend
          - name: project-service
            dockerfile: backend/project-service/Dockerfile
            context: backend
          - name: task-service
            dockerfile: backend/task-service/Dockerfile
            context: backend
          - name: api-gateway
            dockerfile: backend/api-gateway/Dockerfile
            context: backend
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Download JARs
        if: matrix.service.name != 'frontend'
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: backend

      - name: Restore JAR directory structure
        if: matrix.service.name != 'frontend'
        run: |
          for svc in auth-service project-service task-service api-gateway; do
            mkdir -p backend/${svc}/target
          done
          find backend -maxdepth 1 -name "*.jar" | while read jar; do
            svc=$(basename $jar | sed 's/-1.0.0.jar//')
            cp $jar backend/${svc}/target/
          done

      - name: Build image — ${{ matrix.service.name }}
        run: |
          docker build \
            -f ${{ matrix.service.dockerfile }} \
            -t ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }} \
            ${{ matrix.service.context }}

      - name: Trivy scan — ${{ matrix.service.name }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Trivy SARIF — ${{ matrix.service.name }}
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif
          category: trivy-${{ matrix.service.name }}

  push-images:
    name: Push Images to Amazon ECR
    runs-on: ubuntu-latest
    needs: [sonarqube, snyk, trivy]
    if: ${{ !inputs.skip_deploy }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: backend

      - name: Restore JAR directory structure
        run: |
          for svc in auth-service project-service task-service api-gateway; do
            mkdir -p backend/${svc}/target
          done
          find backend -maxdepth 1 -name "*.jar" | while read jar; do
            svc=$(basename $jar | sed 's/-1.0.0.jar//')
            cp $jar backend/${svc}/target/
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend images
        run: |
          for svc in auth-service project-service task-service api-gateway; do
            IMAGE=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${svc}
            docker build \
              -f backend/${svc}/Dockerfile \
              -t ${IMAGE}:${{ github.sha }} \
              -t ${IMAGE}:latest \
              backend
            docker push ${IMAGE}:${{ github.sha }}
            docker push ${IMAGE}:latest
          done

      - name: Build and push frontend image
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          docker build \
            -f frontend/Dockerfile \
            -t ${IMAGE}:${{ github.sha }} \
            -t ${IMAGE}:latest \
            frontend
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

  deploy-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: push-images
    if: ${{ !inputs.skip_deploy }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Install EBS CSI Driver
        run: |
          helm repo add aws-ebs-csi-driver https://kubernetes-sigs.github.io/aws-ebs-csi-driver
          helm repo update
          helm upgrade --install aws-ebs-csi-driver aws-ebs-csi-driver/aws-ebs-csi-driver \
            --namespace kube-system \
            --set controller.serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ secrets.AWS_ROLE_ARN }} \
            --wait

      - name: Helm lint
        run: helm lint ./helm/devboard

      - name: Helm upgrade
        run: |
          helm upgrade --install devboard ./helm/devboard \
            --namespace devboard \
            --create-namespace \
            --set global.imageRegistry=${{ env.ECR_REGISTRY }} \
            --set global.imageTag=${{ github.sha }} \
            --set mongodb.rootPassword=${{ secrets.MONGO_ROOT_PASSWORD }} \
            --set auth.jwtSecret=${{ secrets.JWT_SECRET }} \
            --wait \
            --timeout 5m \
            --atomic

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/auth-service    -n devboard
          kubectl rollout status deployment/project-service -n devboard
          kubectl rollout status deployment/task-service    -n devboard
          kubectl rollout status deployment/api-gateway     -n devboard
          kubectl rollout status deployment/frontend        -n devboard

      - name: Print deployed image tags
        run: |
          echo "Deployed image tag: ${{ github.sha }}"
          kubectl get pods -n devboard
