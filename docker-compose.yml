services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: devboard
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/devboard?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m

  project-service:
    build:
      context: ./backend
      dockerfile: project-service/Dockerfile
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/devboard?authSource=admin
      AUTH_URL: http://auth-service:8081
      TASK_URL: http://task-service:8083
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m

  task-service:
    build:
      context: ./backend
      dockerfile: task-service/Dockerfile
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/devboard?authSource=admin
      AUTH_URL: http://auth-service:8081
      PROJECT_URL: http://project-service:8082
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    environment:
      AUTH_URL: http://auth-service:8081
      PROJECT_URL: http://project-service:8082
      TASK_URL: http://task-service:8083
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      project-service:
        condition: service_started
      task-service:
        condition: service_started
    restart: unless-stopped
    mem_limit: 384m

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api-gateway]
    restart: unless-stopped

volumes:
  mongo_data:
